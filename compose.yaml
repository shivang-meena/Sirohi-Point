services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sirohi_point
      POSTGRES_USER: sirohi
      POSTGRES_PASSWORD: sirohi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirohi -d sirohi_point"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sirohi_postgres_data:/var/lib/postgresql/data

volumes:
  sirohi_postgres_data:
